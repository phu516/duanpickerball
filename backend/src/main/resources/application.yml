server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  config:
    import: optional:file:./application-local.properties,optional:file:./backend/application-local.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/picklezone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:picklezone}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
app:
  frontend-origin: ${PICKLE_FRONTEND_ORIGIN:http://localhost:5173}
  booking:
    hold-minutes: 30
    arrival-grace-minutes: 30
    minimum-minutes: 120
    slot-minutes: 30
    deposit-percent: 30
  guest-token-hours: 2160
