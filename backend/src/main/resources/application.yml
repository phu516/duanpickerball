server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${PICKLE_COOKIE_SAME_SITE:lax}
        secure: ${PICKLE_COOKIE_SECURE:false}
spring:
  mail:
    host: ${PICKLE_SMTP_HOST:}
    port: ${PICKLE_SMTP_PORT:587}
    username: ${PICKLE_SMTP_USERNAME:}
    password: ${PICKLE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${PICKLE_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${PICKLE_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    import: optional:file:./application-local.properties,optional:file:./backend/application-local.properties
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/picklezone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:picklezone}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
app:
  mail-from: ${PICKLE_MAIL_FROM:}
  otp-secret: ${PICKLE_OTP_SECRET:}
  frontend-origin: ${PICKLE_FRONTEND_ORIGIN:http://localhost:5173}
  payment:
    provider: ${PICKLE_PAYMENT_PROVIDER:SANDBOX}
  booking:
    hold-minutes: 30
    arrival-grace-minutes: 30
    minimum-minutes: 120
    slot-minutes: 30
    deposit-percent: 30
    deposit-override-amount: ${PICKLE_DEPOSIT_OVERRIDE_AMOUNT:0}
  guest-token-hours: 2160
