# Local development uses the same MySQL datasource as application.yml.
# Credentials are loaded from backend/application-local.properties.
app:
  payment:
    sandbox-enabled: true
  seed:
    enabled: ${PICKLE_SEED_ENABLED:false}
  dev-admin:
    username: ${PICKLE_DEV_ADMIN_USERNAME:admin}
    password: ${PICKLE_DEV_ADMIN_PASSWORD:}
  dev-staff:
    username: ${PICKLE_DEV_STAFF_USERNAME:staff}
    password: ${PICKLE_DEV_STAFF_PASSWORD:}
